<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            width: 350px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #3498db;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .role {
            color: #777;
            margin-bottom: 15px;
        }

        .bio {
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .details {
            text-align: left;
            margin-bottom: 20px;
        }

        .details p {
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="https://via.placeholder.com/120" 
             alt="Profile Picture" 
             class="profile-img">

        <h1>Prince Rajbhar</h1>

        <p class="role">B.E. Information Technology Student</p>

        <p class="bio">
            Hello! I am a student interested in programming,
            web development, and technology.
        </p>

        <div class="details">
            <p><strong>College:</strong> Thakur College of Engineering and Technology</p>
            <p><strong>Branch:</strong> Information Technology</p>
            <p><strong>Year:</strong> Second Year</p>
            <p><strong>Email:</strong> prince@example.com</p>
        </div>

        <a href="#" class="btn">Contact Me</a>

    </div>

</body>
</html>
